name: Deploy Allure Report

on:
  workflow_dispatch: # Allows manual run
  push:
    branches: [ master ]
    paths:
      - 'POM_Automation/**' # Triggers only when files in your project change

# CRITICAL: This permission allows the bot to create the 'gh-pages' branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./POM_Automation

    steps:
      # 1. Get the code
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: POM_Automation/package-lock.json

      # 3. Install Dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Run Tests
      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true # Keep going even if tests fail

      # 6. Get History (required for Allure trend graphs)
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 7. Generate the HTML Report
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: POM_Automation/allure-results
          allure_history: allure-history
          keep_reports: 20

      # 8. Deploy to GitHub Pages (This step CREATES the missing branch)
      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history