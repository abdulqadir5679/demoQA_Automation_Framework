name: Unified Automation Suite (API Debug Mode)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # ----------------------------------------------------------------
      # PART B: API AUTOMATION (GoRest_POM_Automation)
      # ----------------------------------------------------------------
      - name: "[API] Install Dependencies"
        working-directory: ./GoRest_POM_Automation
        run: npm ci

      # UPDATED STEP: Native PowerShell Version 
      - name: "[API] Create .env File"
        working-directory: ./GoRest_POM_Automation
        # No 'shell: bash' line needed; it defaults to PowerShell on Windows
        run: |
          # 1. Create the file with the Base URL (Set-Content overwrites/creates)
          Set-Content -Path .env -Value "BASE_URL=https://gorest.co.in/public/v2" -Encoding Utf8
          
          # 2. Append the Token (Add-Content adds to the end)
          Add-Content -Path .env -Value "API_TOKEN=$env:SECRET_TOKEN" -Encoding Utf8
          
          # 3. Print success message
          Write-Host "✅ .env file created successfully using PowerShell!"
        env:
          SECRET_TOKEN: ${{ secrets.FRESH_TOKEN }}

      - name: "[API] Run Tests"
        working-directory: ./GoRest_POM_Automation
        run: npx playwright test
        continue-on-error: true

      # ----------------------------------------------------------------
      # PART C: HISTORY & REPORT GENERATION
      # ----------------------------------------------------------------
      - name: Get Previous History (gh-pages)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Generate API Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: GoRest_POM_Automation/allure-results
          gh_pages: gh-pages-history/api-report
          allure_report: allure-report-api
          allure_history: allure-history-api
          keep_reports: 20

      # ----------------------------------------------------------------
      # PART D: CONSOLIDATE & DEPLOY
      # ----------------------------------------------------------------
      - name: Prepare Site Structure
        if: always()
        run: |
          mkdir -p _site/api-report
          
          # UI Report (Preserve Old)
          if [ -d "allure-report-ui" ]; then 
            cp -r allure-report-ui/* _site/
          elif [ -d "gh-pages-history" ]; then
            cp -r gh-pages-history/* _site/ || true
          fi
          
          # API Report (New)
          if [ -d "allure-report-api" ]; then cp -r allure-report-api/* _site/api-report/; fi

      - name: Deploy Unified Site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site