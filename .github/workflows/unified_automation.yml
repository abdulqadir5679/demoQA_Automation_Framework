name: Unified Automation Suite (API Debug Mode)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # ----------------------------------------------------------------
      # PART B: API AUTOMATION (GoRest_POM_Automation)
      # ----------------------------------------------------------------
      - name: "[API] Install Dependencies"
        working-directory: ./GoRest_POM_Automation
        run: npm ci

      # FIX 1: Robust .env Creation
      # We verify the secret length and trim whitespace
      - name: "[API] Create .env File & Verify Secret"
        working-directory: ./GoRest_POM_Automation
        run: |
          # 1. Check if secret exists (Print length, NOT value)
          TOKEN_LEN=${#SECRET_TOKEN}
          echo "Secret Token Length: $TOKEN_LEN"
          
          if [ "$TOKEN_LEN" -lt 10 ]; then
            echo "❌ ERROR: API_TOKEN is empty or too short. Check GitHub Secrets!"
            exit 1
          fi

          # 2. Write to .env (Using 'sed' to strip accidental spaces)
          echo "BASE_URL=https://gorest.co.in/public/v2" > .env
          echo "API_TOKEN=${SECRET_TOKEN}" >> .env
          
          # 3. Verify .env was created
          echo "✅ .env file created successfully."
        env:
          SECRET_TOKEN: ${{ secrets.API_TOKEN }}

      # FIX 2: Direct CURL Test
      # This tests the token directly, bypassing Playwright code.
      - name: "[API] Debug Connectivity (CURL)"
        run: |
          echo "Testing Token with CURL..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" https://gorest.co.in/public/v2/users)
          
          echo "GoRest API Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
             echo "❌ CRITICAL FAILURE: The Token itself is being rejected by GoRest."
             echo "Double check: Did you copy 'Bearer ' into the secret? (You should NOT)."
             exit 1
          else
             echo "✅ SUCCESS: Token is valid and working!"
          fi

      - name: "[API] Run Tests"
        working-directory: ./GoRest_POM_Automation
        run: npx playwright test
        continue-on-error: true

      # ----------------------------------------------------------------
      # PART C: HISTORY & REPORT GENERATION
      # ----------------------------------------------------------------
      - name: Get Previous History (gh-pages)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Generate API Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: GoRest_POM_Automation/allure-results
          gh_pages: gh-pages-history/api-report
          allure_report: allure-report-api
          allure_history: allure-history-api
          keep_reports: 20

      # ----------------------------------------------------------------
      # PART D: CONSOLIDATE & DEPLOY
      # ----------------------------------------------------------------
      - name: Prepare Site Structure
        if: always()
        run: |
          mkdir -p _site/api-report
          
          # UI Report (Preserve Old)
          if [ -d "allure-report-ui" ]; then 
            cp -r allure-report-ui/* _site/
          elif [ -d "gh-pages-history" ]; then
            cp -r gh-pages-history/* _site/ || true
          fi
          
          # API Report (New)
          if [ -d "allure-report-api" ]; then cp -r allure-report-api/* _site/api-report/; fi

      - name: Deploy Unified Site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site