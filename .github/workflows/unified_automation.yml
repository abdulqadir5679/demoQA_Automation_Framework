name: Unified Automation Suite (UI & API)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      # 1. Checkout Code
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # PART A: UI AUTOMATION (POM_Automation)
      - name: [UI] Install Dependencies
        working-directory: ./POM_Automation
        run: npm ci

      - name: [UI] Install Browsers
        working-directory: ./POM_Automation
        run: npx playwright install chromium --with-deps

      - name: [UI] Run Tests
        working-directory: ./POM_Automation
        run: npx playwright test
        continue-on-error: true

      # PART B: API AUTOMATION (GoRest_POM_Automation)
      - name: [API] Install Dependencies
        working-directory: ./GoRest_POM_Automation
        run: npm ci

      - name: [API] Create .env File
        working-directory: ./GoRest_POM_Automation
        run: |
          echo "BASE_URL=https://gorest.co.in/public/v2" >> .env
          echo "API_TOKEN=${{ secrets.API_TOKEN }}" >> .env

      - name: [API] Run Tests
        working-directory: ./GoRest_POM_Automation
        run: npx playwright test
        continue-on-error: true

      # PART C: HISTORY & REPORT GENERATION
      - name: Get Previous History (gh-pages)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      # GENERATE UI REPORT
      - name: Generate UI Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: POM_Automation/allure-results
          # We grab history from root of gh-pages
          gh_pages: gh-pages-history
          allure_report: allure-report-ui
          allure_history: allure-history-ui
          keep_reports: 20

      # GENERATE API REPORT
      - name: Generate API Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: GoRest_POM_Automation/allure-results
          # We grab history from /api-report/ subfolder
          gh_pages: gh-pages-history/api-report
          allure_report: allure-report-api
          allure_history: allure-history-api
          keep_reports: 20

      # PART D: CONSOLIDATE & DEPLOY
      - name: Prepare Site Structure
        if: always()
        run: |
          mkdir -p _site
          # 1. Copy UI Report to Root
          cp -r allure-history-ui/* _site/
          
          # 2. Copy API Report to Subfolder
          mkdir -p _site/api-report
          cp -r allure-history-api/* _site/api-report/

      - name: Deploy Unified Site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site