name: Unified Automation Suite (API Debug Mode)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # ----------------------------------------------------------------
      # PART A: UI AUTOMATION (DISABLED FOR DEBUGGING 🛑)
      # ----------------------------------------------------------------
      # - name: "[UI] Install Dependencies"
      #   working-directory: ./POM_Automation
      #   run: npm ci

      # - name: "[UI] Install Browsers"
      #   working-directory: ./POM_Automation
      #   run: npx playwright install chromium --with-deps

      # - name: "[UI] Run Tests"
      #   working-directory: ./POM_Automation
      #   run: npx playwright test
      #   continue-on-error: true

      # ----------------------------------------------------------------
      # PART B: API AUTOMATION (GoRest_POM_Automation)
      # ----------------------------------------------------------------
      - name: "[API] Install Dependencies"
        working-directory: ./GoRest_POM_Automation
        run: npm ci

      - name: "[API] Create .env File"
        working-directory: ./GoRest_POM_Automation
        run: |
          echo "BASE_URL=https://gorest.co.in/public/v2" >> .env
          echo "API_TOKEN=${{ secrets.API_TOKEN }}" >> .env

      - name: "[API] Run Tests"
        working-directory: ./GoRest_POM_Automation
        run: npx playwright test
        continue-on-error: true

      # ----------------------------------------------------------------
      # PART C: HISTORY & REPORT GENERATION
      # ----------------------------------------------------------------
      - name: Get Previous History (gh-pages)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      # GENERATE UI REPORT (DISABLED 🛑)
      # - name: Generate UI Report
      #   uses: simple-elf/allure-report-action@master
      #   if: always()
      #   with:
      #     allure_results: POM_Automation/allure-results
      #     gh_pages: gh-pages-history
      #     allure_report: allure-report-ui
      #     allure_history: allure-history-ui
      #     keep_reports: 20

      # GENERATE API REPORT
      - name: Generate API Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: GoRest_POM_Automation/allure-results
          gh_pages: gh-pages-history/api-report
          allure_report: allure-report-api
          allure_history: allure-history-api
          keep_reports: 20

      # ----------------------------------------------------------------
      # PART D: CONSOLIDATE & DEPLOY (FIXED FOR 404 ERROR ✅)
      # ----------------------------------------------------------------
      - name: Prepare Site Structure
        if: always()
        run: |
          mkdir -p _site/api-report
          
          # 1. Copy LATEST UI Report (If exists) - kept to preserve old site
          # Since we skipped UI tests, we try to copy OLD history if current report missing
          if [ -d "allure-report-ui" ]; then 
            cp -r allure-report-ui/* _site/
          elif [ -d "gh-pages-history" ]; then
            # Fallback: Copy the old site content so the root link doesn't break entirely
            cp -r gh-pages-history/* _site/ || true
          fi
          
          # 2. Copy LATEST API Report to Subfolder (FIXES 404)
          # We copy the REPORT, not the history, to the serving folder
          if [ -d "allure-report-api" ]; then cp -r allure-report-api/* _site/api-report/; fi

      - name: Deploy Unified Site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site