name: Playwright Tests (POM_Automation)

on:
  push:
    branches: [ master ]
    # Only run if changes are made inside the POM_Automation folder
    paths:
      - 'POM_Automation/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'POM_Automation/**'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # This ensures all 'run' commands happen inside your subfolder
    defaults:
      run:
        working-directory: ./POM_Automation

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        cache-dependency-path: POM_Automation/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        # Path must be from the repository root
        path: POM_Automation/playwright-report/
        retention-days: 30