name: GoRest API Tests & Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  api-test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Create .env file
      run: |
        echo "BASE_URL=https://gorest.co.in/public/v2" >> .env
        echo "API_TOKEN=${{ secrets.API_TOKEN }}" >> .env

    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true

    # --- HISTORY HANDLING FOR SUB-FOLDER ---
    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Restore History from Subfolder
      run: |
        mkdir -p allure-history
        # We try to copy history from the 'api-report' subfolder
        cp -r gh-pages/api-report/history/* allure-history/ || true

    # --- REPORT GENERATION ---
    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    # --- DEPLOYMENT TO SUB-FOLDER ---
    - name: Deploy to GitHub Pages (Subfolder)
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
        destination_dir: api-report   # <--- Puts it in a separate folder
        keep_files: true              # <--- CRITICAL: Don't delete the UI report!